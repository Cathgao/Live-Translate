[package]
name = "live-translate-desktop"
version = "0.1.0"
description = "Live Translate desktop client (Tauri 2 + React)"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "live_translate_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
parking_lot = "0.12"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
